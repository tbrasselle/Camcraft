[package]
name = "xtask"
description = "Process tooling for the camcraft workspace (gate tiers, decision collection): cargo xtask. Not shipped."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Already in the lock (tracing-subscriber's env-filter pulls it): no new crate in the tree. Ports the
# gate scripts' .NET regexes (gate maps, #[test] fn spans, diff hunks) one-for-one.
regex = "1"
# `cargo xtask icons` (#661): rasterises the SVG icon masters (assets/ui/svg/) to the PNGs the UI loads.
# xtask-only - never a runtime dependency of the app or ui crates. MIT OR Apache-2.0. Pinned exactly;
# 0.45 shares the tiny-skia 0.11 already in the lock. No default features: no text, fonts or raster
# images - the masters are shapes only (the lint refuses anything else).
resvg = { version = "=0.45.1", default-features = false }
