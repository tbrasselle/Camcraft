[workspace]
resolver = "3"
members = ["crates/app", "crates/cl", "crates/motion", "crates/post", "crates/sim",
  "crates/tools", "crates/ui", "crates/geometry", "crates/kernel", "xtask"]

[workspace.package]
version = "0.15.0"
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
camcraft-app = { path = "crates/app" }
camcraft-geometry = { path = "crates/geometry" }
camcraft-cl = { path = "crates/cl" }
camcraft-tools = { path = "crates/tools" }
camcraft-post = { path = "crates/post" }
camcraft-sim = { path = "crates/sim" }
camcraft-motion = { path = "crates/motion" }

# ECS - alpha bindings, hard-pinned; expect churn on bumps.
# flecs_alerts is NOT optional: flecs_ecs_sys 0.2.1's bindings.rs references
# ecs_alert_desc_t ungated, so the sys crate only compiles with that feature on.
flecs_ecs = { version = "=0.2.2", default-features = false, features = ["flecs_base", "std", "flecs_alerts"] }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

# Data-parallel batch generation (M5.3 B): rayon's ordered collect keeps a
# parallel RegenerateAll byte-identical to the serial one. MIT OR
# Apache-2.0; pure Rust (its deps included), no build scripts of concern.
rayon = "1"

# Diagnostics to the launching terminal (#163): `tracing` events at the
# app's seams, printed by `tracing-subscriber`'s fmt layer on stderr and
# filtered by CAMCRAFT_LOG / RUST_LOG. Both MIT, pure Rust.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "std", "tracing-log"] }

# The JS engine - one in the tree (M5.3 F): the post's sandbox (post/js.rs)
# and the job-script host (app/script) run the same hard-pinned boa.
boa_engine = "0.21.1"

# Platform + dialog deps shared with the UI stack; imgui retired at M1.4.2
# M-g (the dear-imgui-* trio left with it).
# No direct wgpu dep: camcraft-ui uses egui_wgpu::wgpu so types match the
# renderer exactly (wgpu is re-exported, version-selected by the set below).
winit = "0.30"
rfd = "0.15"
pollster = "0.4"

# The shell (M1.4.2 graduation; was the M1.4.1 spike, decision in
# docs/spike-egui-go-no-go.md): egui stack, MIT OR Apache-2.0 (egui_dock: MIT) - notices in
# assets/ui/LICENSES.md.
# Hard-pinned AS A SET: egui_dock 0.21.1 wants egui ^0.36 (not 0.37), and
# 0.36.2 pins wgpu ^30.0 / winit ^0.30.13 - exactly our lock (30.0.1 /
# 0.30.13), so no forced upgrades. Bump together or hold
# (verified 2026-10-16 against crates.io). egui_kittest is dev-only and
# joined at S3, on the same set.
egui = "=0.36.2"
egui-winit = "=0.36.2"
egui-wgpu = "=0.36.2"
egui_dock = "=0.21.1"
egui_kittest = { version = "=0.36.2", features = ["wgpu", "snapshot"] }
# PNG decode for the UI icon set (assets/ui/*.png -> egui_app/icons.rs).
# Png only: everything else (formats, headers of other codecs) stays off.
image = { version = "0.25", default-features = false, features = ["png"] }

# STEP reading - truck geometry stack (ricosjp), pure Rust, Apache-2.0. The
# Sept-2024 mutual version set; hard-pinned because the crates are alpha.
# meshalgo's default features pull vtkio -> lzma-sys (C code): keep it off and
# take only `tessellation` (which enables `filters` + spade, both pure Rust).
# Polygon booleans/offset - pure-Rust port (BSL-1.0) of the published Clipper2,
# backing crates/app/src/geo2d.rs. Hard-pinned (young project); the `clipper2`
# crate alternative is rejected because it builds C++ (our posture is pure Rust,
# same reasoning as meshalgo's off defaults above). Notice text in
# assets/ui/LICENSES.md.
clipper2-rust = "=1.2.0"

truck-stepio = "=0.3.0"
truck-topology = "=0.6.0"
truck-polymesh = "=0.6.0"
truck-meshalgo = { version = "=0.4.0", default-features = false, features = ["tessellation"] }
ruststep = "=0.4.0"

# Third-party code is optimized even in dev builds: an unoptimized truck
# tessellation or wgpu pass is 5-20x slower and makes imports feel like
# freezes. Our own crates keep full debug settings. One-time rebuild cost.
[profile.dev.package."*"]
opt-level = 2
